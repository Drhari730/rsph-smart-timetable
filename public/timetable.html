<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Weekly Timetable | RSPH Smart Timetable</title>
<link rel="icon" type="image/svg+xml" href="assets/rsph_icon.svg"/>
<link rel="stylesheet" href="assets/style.css"/>
</head>
<body>
<div id="site-header"></div>

<main class="container">

<div class="page-title-bar">
  <span class="eyebrow smallcaps">Issued semester timetable</span>
  <h1 id="pg-title">Weekly Timetable</h1>
  <p id="pg-sub">Select a programme and semester. The grid, the load figures and the calendar export are all generated from the issued timetable.</p>
</div>

<!-- controls -->
<div class="controls no-print">
  <div class="control-group">
    <label>Programme</label>
    <div class="seg" id="seg-prog"></div>
  </div>
  <div class="control-group">
    <label>Semester</label>
    <div class="seg" id="seg-sem"></div>
  </div>
  <div class="control-group">
    <label>View</label>
    <div class="seg" id="seg-view">
      <button type="button" data-view="grid" aria-pressed="true">Weekly grid</button>
      <button type="button" data-view="agenda" aria-pressed="false">Day by day</button>
      <button type="button" data-view="calendar" aria-pressed="false">Calendar</button>
    </div>
  </div>
  <div class="control-group" style="flex:1;min-width:210px;">
    <label>Find a course, activity or teacher</label>
    <input class="ctrl-input" id="q" type="search" placeholder="e.g. Biostatistics, Journal Club, Mrinalini" style="width:100%"/>
  </div>
  <div class="ctrl-actions">
    <button class="btn" id="btn-ics" type="button">&#128197; Add to calendar</button>
    <button class="btn" id="btn-png" type="button">&#8681; Download PNG</button>
    <button class="btn" id="btn-pdf" type="button">&#8681; Download PDF</button>
    <button class="btn" id="btn-xlsx" type="button" title="Spreadsheet in the same layout and colours, with the day-wise teaching plan">&#8681; Download Excel</button>
    <button class="btn primary" id="btn-print" type="button">&#128438; Print</button>
  </div>
</div>

<!-- download range: which dates the Excel / PNG / PDF downloads cover -->
<div class="range-bar no-print" id="range-bar">
  <div class="control-group">
    <label for="r-from">Download from</label>
    <input class="ctrl-input" type="date" id="r-from"/>
  </div>
  <div class="control-group">
    <label for="r-to">To</label>
    <input class="ctrl-input" type="date" id="r-to"/>
  </div>
  <div class="control-group">
    <label>Quick duration from the start date</label>
    <div class="seg" id="seg-range">
      <button type="button" data-range="shown">Week on screen</button>
      <button type="button" data-range="1w">1 week</button>
      <button type="button" data-range="1m">1 month</button>
      <button type="button" data-range="2m">2 months</button>
      <button type="button" data-range="3m">3 months</button>
      <button type="button" data-range="term">Whole semester</button>
    </div>
  </div>
  <p class="range-sum" id="r-sum"></p>
</div>

<div id="body"></div>

</main>
<div id="site-footer"></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="assets/excel.js"></script>
<script>
RSPH_READY.then(function(){
  TT.mountChrome('timetable.html');

  var params = new URLSearchParams(location.search);
  var state = {
    prog: params.get('p') || 'mph',
    sem: +(params.get('s') || 3),
    view: 'grid',
    q: '',
    kind: null,
    month: null, // {y,m} — set on first render once the timetable is known
    week: null,  // Monday of the week shown in the grid / day-by-day views
    weekFor: null // which timetable `week` was chosen for
  };

  /* The week to open on: this week if the timetable is in term today (or has
     no dates at all), otherwise the week its term starts. */
  function defaultWeek(tt){
    var today = new Date();
    if (TT.dateInTerm(tt, today) || !tt.start) return TT.mondayOfWeek(today);
    return TT.mondayOfWeek(TT.parseDate(tt.start));
  }
  function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  if (!RSPH.programmes[state.prog]) state.prog = 'mph';

  /* ---------- segmented controls ---------- */
  function buildSegs(){
    document.getElementById('seg-prog').innerHTML = Object.keys(RSPH.programmes).map(function(k){
      return '<button type="button" data-prog="'+k+'" aria-pressed="'+(k===state.prog)+'">' +
             RSPH.programmes[k].short+'</button>';
    }).join('');
    document.getElementById('seg-sem').innerHTML = [1,2,3,4].map(function(s){
      var has = !!TT.getTT(state.prog, s);
      return '<button type="button" data-sem="'+s+'" aria-pressed="'+(s===state.sem)+'"' +
             (has?'':' disabled title="Timetable not yet issued"')+'>Sem '+s+'</button>';
    }).join('');
  }

  document.getElementById('seg-prog').addEventListener('click', function(e){
    var b = e.target.closest('button[data-prog]'); if (!b) return;
    state.prog = b.getAttribute('data-prog');
    // jump to the first semester of that programme that has a timetable
    var first = [1,2,3,4].filter(function(s){ return TT.getTT(state.prog, s); })[0];
    if (!TT.getTT(state.prog, state.sem)) state.sem = first || state.sem;
    sync();
  });
  document.getElementById('seg-sem').addEventListener('click', function(e){
    var b = e.target.closest('button[data-sem]'); if (!b || b.disabled) return;
    state.sem = +b.getAttribute('data-sem'); sync();
  });
  document.getElementById('seg-view').addEventListener('click', function(e){
    var b = e.target.closest('button[data-view]'); if (!b) return;
    state.view = b.getAttribute('data-view');
    TT.$$('#seg-view button').forEach(function(x){
      x.setAttribute('aria-pressed', String(x === b));
    });
    render();
  });
  document.getElementById('q').addEventListener('input', function(e){
    state.q = e.target.value.trim(); render();
  });
  document.getElementById('btn-print').addEventListener('click', function(){ window.print(); });
  document.getElementById('btn-ics').addEventListener('click', function(){
    var tt = TT.getTT(state.prog, state.sem);
    if (tt) TT.downloadICS(tt);
  });
  document.getElementById('btn-png').addEventListener('click', function(){ exportImage('png'); });
  document.getElementById('btn-pdf').addEventListener('click', function(){ exportImage('pdf'); });
  /* ---------- download range ---------- */
  // null = follow the week on screen; otherwise {from, to} the user picked
  var range = null;
  function isoOf(d){ return TT.ymd(d); }
  function currentRange(){
    if (range) return range;
    return { from: state.week, to: addDays(state.week, 6) };
  }
  function addMonths(d, n){ return new Date(d.getFullYear(), d.getMonth() + n, d.getDate()); }
  function syncRangeUI(){
    var r = currentRange();
    document.getElementById('r-from').value = isoOf(r.from);
    document.getElementById('r-to').value = isoOf(r.to);
    var days = Math.round((r.to - r.from) / 86400000) + 1;
    var weeks = 0, w = TT.mondayOfWeek(r.from);
    while (w <= r.to) { weeks++; w = addDays(w, 7); }
    document.getElementById('r-sum').innerHTML = 'Downloads cover <strong>' + TT.fmtDate(r.from) + ' &ndash; ' + TT.fmtDate(r.to) +
      '</strong> (' + days + ' day' + (days === 1 ? '' : 's') + ', ' + weeks + ' week' + (weeks === 1 ? '' : 's') + '). ' +
      'Excel: a day-by-day schedule plus one sheet per week. PDF: one page per ' + (state.view === 'calendar' ? 'month' : 'week') +
      '. PNG: one image.' + (range ? '' : ' Following the week on screen.');
    TT.$$('#seg-range button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.range === (range ? range.preset : 'shown'))); });
  }
  function readInputs(){
    var f = TT.parseDate(document.getElementById('r-from').value), t = TT.parseDate(document.getElementById('r-to').value);
    if (!f) return;
    if (!t || t < f) t = f;
    if ((t - f) / 86400000 > 400) t = addDays(f, 400);
    range = { from: f, to: t, preset: null };
    syncRangeUI();
  }
  document.getElementById('r-from').addEventListener('change', function(){
    // keep the chosen duration when only the start moves
    var r = currentRange(), f = TT.parseDate(this.value); if (!f) return;
    var len = Math.round((r.to - r.from) / 86400000);
    var p = range && range.preset;
    var t = p === '1m' ? addDays(addMonths(f, 1), -1) : p === '2m' ? addDays(addMonths(f, 2), -1)
          : p === '3m' ? addDays(addMonths(f, 3), -1) : addDays(f, len);
    range = { from: f, to: t, preset: p && p !== 'term' && p !== 'shown' ? p : null };
    syncRangeUI();
  });
  document.getElementById('r-to').addEventListener('change', readInputs);
  document.getElementById('seg-range').addEventListener('click', function(e){
    var b = e.target.closest('button[data-range]'); if (!b) return;
    var v = b.dataset.range, tt = TT.getTT(state.prog, state.sem);
    var f = range ? range.from : state.week;
    if (v === 'shown') { range = null; }
    else if (v === '1w') range = { from: f, to: addDays(f, 6), preset: v };
    else if (v === '1m') range = { from: f, to: addDays(addMonths(f, 1), -1), preset: v };
    else if (v === '2m') range = { from: f, to: addDays(addMonths(f, 2), -1), preset: v };
    else if (v === '3m') range = { from: f, to: addDays(addMonths(f, 3), -1), preset: v };
    else if (v === 'term') {
      var ms = TT.monthList(tt);
      var s = tt.start ? TT.parseDate(tt.start) : new Date(ms[0].y, ms[0].m, 1);
      var en = tt.end ? TT.parseDate(tt.end) : new Date(ms[ms.length-1].y, ms[ms.length-1].m + 1, 0);
      range = { from: s, to: en, preset: v };
    }
    syncRangeUI();
  });

  function weeksIn(r){
    var out = [], w = TT.mondayOfWeek(r.from);
    while (w <= r.to && out.length < 60) { out.push(w); w = addDays(w, 7); }
    return out;
  }
  function monthsIn(r){
    var out = [], y = r.from.getFullYear(), m = r.from.getMonth();
    while (new Date(y, m, 1) <= r.to && out.length < 14) { out.push({y: y, m: m}); m++; if (m > 11) { m = 0; y++; } }
    return out;
  }
  function rangeTag(r){ return TT.ymd(r.from) + '-to-' + TT.ymd(r.to); }

  document.getElementById('btn-xlsx').addEventListener('click', function(){
    var tt = TT.getTT(state.prog, state.sem);
    if (!tt) { alert('No timetable is issued for this selection yet.'); return; }
    var btn = this, label = btn.textContent;
    btn.textContent = 'Preparing…'; btn.disabled = true;
    var r = currentRange();
    Promise.resolve().then(function(){
      return TT_EXCEL.downloadExcel(tt, { from: r.from, to: r.to });
    }).catch(function(e){ console.error(e); alert('Could not generate the spreadsheet. Please try again.'); })
      .then(function(){ btn.textContent = label; btn.disabled = false; });
  });

  /* Renders the chosen dates in the current view (grid / day by day: one
     block per week; calendar: one per month) into offscreen nodes that
     match what's on screen, and rasterises them with html2canvas. PDF gets
     one page per block; PNG stacks them into a single image. */
  function exportImage(kind){
    var tt = TT.getTT(state.prog, state.sem);
    if (!tt) { alert('No timetable is issued for this selection yet.'); return; }
    var p = RSPH.programmes[state.prog];
    var r = currentRange();
    var btn = document.getElementById(kind === 'pdf' ? 'btn-pdf' : 'btn-png');
    var label = btn.textContent; btn.disabled = true;

    var header = function(sub){
      return '<div style="margin-bottom:14px">' +
        '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#C0383A;font-weight:700">' +
          RSPH.meta.school + '</div>' +
        '<div style="font-family:\'Playfair Display\',Georgia,serif;font-weight:700;font-size:24px;color:#381A6B;margin:6px 0">' +
          p.name + ' &mdash; Semester ' + state.sem + '</div>' +
        '<div style="font-size:12.5px;color:#7A6C7D">Batch ' + tt.batch + ' &middot; Academic Year ' + tt.ay +
          ' &middot; ' + tt.venue + ' &middot; ' + TT.fmtDate(r.from) + ' &ndash; ' + TT.fmtDate(r.to) +
          ' &middot; Downloaded ' + new Date().toLocaleDateString('en-IN', {day:'numeric',month:'long',year:'numeric'}) + '</div>' +
      '</div>' + TT.renderLegend(tt) + '<div class="month-title" style="margin:6px 0 10px">' + sub + '</div>';
    };
    var blocks = state.view === 'calendar'
      ? monthsIn(r).map(function(mm){
          return { title: TT.MONTH_NAMES[mm.m] + ' ' + mm.y, html: TT.renderMonthCalendar(tt, mm.y, mm.m) };
        })
      : weeksIn(r).map(function(w){
          var a = w < r.from ? r.from : w, e = addDays(w, 6); if (e > r.to) e = r.to;
          var o = { weekStart: w, from: r.from, to: r.to };
          return { title: 'Week of ' + TT.fmtDate(a) + ' &ndash; ' + TT.fmtDate(e),
                   html: state.view === 'grid' ? TT.renderGrid(tt, o) : TT.renderAgenda(tt, o) };
        });

    var mk = function(inner){
      var node = document.createElement('div');
      node.style.cssText = 'position:fixed;left:-100000px;top:0;background:#FBF6F1;padding:26px;width:1360px;' +
        "font-family:'Source Serif 4',Georgia,serif;color:#3D2B49;";
      node.innerHTML = inner;
      document.body.appendChild(node);
      return node;
    };
    var shoot = function(node, scale){
      return html2canvas(node, { scale: scale, backgroundColor: '#FBF6F1', windowWidth: 1360 })
        .then(function(c){ document.body.removeChild(node); return c; },
              function(e){ document.body.removeChild(node); throw e; });
    };
    var fname = 'RSPH-' + p.short + '-Sem' + state.sem + '-' + rangeTag(r);
    var done = function(){ btn.textContent = label; btn.disabled = false; };
    var fail = function(e){ console.error(e); alert('Could not generate the file. Please try again.'); };

    if (kind === 'png') {
      btn.textContent = 'Preparing…';
      var node = mk(blocks.map(function(b, i){
        return (i === 0 ? header(b.title) : '<div class="month-title" style="margin:28px 0 10px">' + b.title + '</div>') + b.html;
      }).join(''));
      // browsers cap canvas height (~32k px), so long ranges render at a lower scale
      var scale = Math.max(0.5, Math.min(2, 30000 / Math.max(1, node.offsetHeight)));
      shoot(node, scale).then(function(canvas){
        var a = document.createElement('a');
        a.download = fname + '.png';
        a.href = canvas.toDataURL('image/png');
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }).catch(fail).then(done);
      return;
    }

    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    var pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight(), margin = 24;
    var i = 0;
    (function next(){
      if (i >= blocks.length) { pdf.save(fname + '.pdf'); done(); return; }
      btn.textContent = 'Page ' + (i + 1) + ' of ' + blocks.length + '…';
      var b = blocks[i];
      shoot(mk(header(b.title) + b.html), 1.6).then(function(canvas){
        if (i > 0) pdf.addPage('a4', 'landscape');
        var imgW = pageW - margin * 2, imgH = canvas.height * imgW / canvas.width;
        if (imgH > pageH - margin * 2) { imgH = pageH - margin * 2; imgW = canvas.width * imgH / canvas.height; }
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, imgW, imgH);
        i++; next();
      }).catch(function(e){ fail(e); done(); });
    })();
  }

  function sync(){
    history.replaceState(null, '', 'timetable.html?p='+state.prog+'&s='+state.sem);
    buildSegs(); render();
  }

  /* ---------- main render ---------- */
  function render(){
    var tt = TT.getTT(state.prog, state.sem);
    var p  = RSPH.programmes[state.prog];
    document.getElementById('pg-title').innerHTML = p.name + ' &mdash; Semester ' + state.sem;

    if (!tt){
      document.getElementById('pg-sub').innerHTML =
        'No timetable has been issued for this semester yet.';
      document.getElementById('body').innerHTML =
        '<div class="empty-state"><h3>Timetable not yet issued</h3>' +
        '<p>The approved scheme for ' + p.short + ' Semester ' + state.sem + ' is listed on the ' +
        '<a href="courses.html?p='+state.prog+'&s='+state.sem+'" style="color:var(--wine);text-decoration:underline">course catalogue</a>. ' +
        'Once the School issues the timetable it is added to <code>assets/data.js</code> and this page fills in automatically.</p></div>';
      document.getElementById('range-bar').style.display = 'none';
      return;
    }

    var now = new Date();
    var live = TT.inTerm(tt, now);
    var filter = { q: state.q, kind: state.kind };
    var months = TT.monthList(tt);
    if (state.weekFor !== tt.id) { state.week = defaultWeek(tt); state.weekFor = tt.id; state.month = null; }
    if (!state.month || !months.some(function(mo){ return mo.y===state.month.y && mo.m===state.month.m; })) {
      var todayIdx = months.findIndex(function(mo){ return mo.y===now.getFullYear() && mo.m===now.getMonth(); });
      state.month = months[todayIdx >= 0 ? todayIdx : 0];
    }

    document.getElementById('pg-sub').innerHTML =
      'Batch ' + tt.batch + ' &middot; Academic Year ' + tt.ay + ' &middot; ' + tt.faculty +
      '. Source: ' + tt.source + '.';

    /* meta strip */
    var contact = TT.weeklyContact(tt);
    var nSess = TT.sessions(tt).filter(function(s){return s.kind!=='lunch';}).length;
    var wk = TT.weekOfTerm(tt, now), tw = TT.termWeeks(tt);

    var meta =
      '<div class="tt-meta">' +
        cell('Venue', tt.venue, 'As printed on the issued timetable') +
        cell('Term', (tt.start ? TT.fmtDate(TT.parseDate(tt.start)) : 'Not issued') +
             (tt.end ? ' &ndash; ' + TT.fmtDate(TT.parseDate(tt.end)) : ''),
             tw ? tw + ' teaching weeks' : 'End date not issued') +
        cell('Contact hours / week', TT.hrs(contact), nSess + ' scheduled sessions') +
        cell('Status', live === true ? 'In term' : (live === false ? 'Out of term' : 'Dates not issued'),
             live === true && wk ? 'Week ' + wk + (tw ? ' of ' + tw : '') : '&mdash;') +
      '</div>';

    /* term progress */
    var term = '';
    if (live === true && wk && tw){
      var pct = Math.min(100, Math.round(wk / tw * 100));
      term = '<div class="term-bar"><div class="term-line"><span>Week ' + wk + ' of ' + tw + '</span>' +
             '<span>' + pct + '% of the semester elapsed</span></div>' +
             '<div class="term-track"><div class="term-fill" style="width:' + pct + '%"></div></div></div>';
    }

    /* grid, agenda or calendar */
    var monthNav = '';
    var main;
    if (state.view === 'calendar') {
      monthNav = '<div class="month-nav no-print">' +
        '<span class="month-title">' + TT.MONTH_NAMES[state.month.m] + ' ' + state.month.y + '</span>' +
        '<div class="month-tabs">' + months.map(function(mo){
          return '<button type="button" class="month-tab' + (mo.y===state.month.y && mo.m===state.month.m ? ' active' : '') +
                 '" data-y="' + mo.y + '" data-m="' + mo.m + '">' + TT.MONTH_NAMES[mo.m].slice(0,3) + ' ' + mo.y + '</button>';
        }).join('') + '</div></div>';
      main = TT.renderMonthCalendar(tt, state.month.y, state.month.m);
    } else {
      var wEnd = addDays(state.week, 6);
      // counted in calendar weeks (Mon-Sun), so a term that starts mid-week
      // has that part-week as Week 1 and the following Monday as Week 2
      var wk = tt.start ? Math.round((state.week - TT.mondayOfWeek(TT.parseDate(tt.start))) / 604800000) + 1 : null;
      var anyIn = [0,1,2,3,4,5,6].some(function(n){ return TT.dateInTerm(tt, addDays(state.week, n)); });
      var sub = !anyIn
        ? (tt.start && wEnd < TT.parseDate(tt.start) ? 'Before this semester starts (' + TT.fmtDate(TT.parseDate(tt.start)) + ')' : 'After this semester ends')
        : (wk ? 'Week ' + wk + ' of the semester' + (tw ? ' of ' + tw : '') : 'Term dates not on record &mdash; module dates assume teaching from 1 September');
      var thisMon = TT.mondayOfWeek(new Date());
      monthNav = '<div class="week-nav no-print">' +
        '<span class="wk-label">' + TT.fmtDate(state.week) + ' &ndash; ' + TT.fmtDate(wEnd) +
          '<span class="wk-sub">' + sub + '</span></span>' +
        '<span class="wk-btns">' +
          '<button type="button" class="month-tab" data-week="-7">&lsaquo; Previous week</button>' +
          (state.week.getTime() !== thisMon.getTime() ? '<button type="button" class="month-tab" data-week="today">This week</button>' : '') +
          '<button type="button" class="month-tab" data-week="7">Next week &rsaquo;</button>' +
        '</span></div>';
      main = state.view === 'grid' ? TT.renderGrid(tt, {filter: filter, weekStart: state.week})
                                   : TT.renderAgenda(tt, {filter: filter, weekStart: state.week});
    }

    /* weekly load per course */
    var load = TT.courseLoad(tt);
    var max = load.reduce(function(a,r){ return Math.max(a, r.minutes); }, 0) || 1;
    var loadRows = load.map(function(r){
      var c = r.code ? TT.course(tt.prog, r.code) : null;
      var col = '#381A6B';
      return '<tr>' +
        '<td class="code">' + (r.code || '&mdash;') + '</td>' +
        '<td>' + r.title + (c ? '' : ' <span class="pill mute">activity</span>') + '</td>' +
        '<td class="num">' + (c ? c.credits : '&mdash;') + '</td>' +
        '<td class="num">' + r.count + '</td>' +
        '<td><div class="bar-cell" style="--k:' + col + '">' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + (r.minutes/max*100) + '%"></div></div>' +
          '<span class="bar-val">' + TT.hrs(r.minutes) + '</span></div></td>' +
      '</tr>';
    }).join('');

    /* coverage of the approved scheme */
    var cov = TT.coverage(state.prog, state.sem);
    var missing = cov.filter(function(c){ return !c.present; });
    var covNote = missing.length
      ? '<p class="note warn"><span class="note-lbl">Scheme courses with no slot on this grid</span>' +
        '<ul>' + missing.map(function(m){
          return '<li><strong>' + m.course.code + '</strong> &mdash; ' + m.course.title +
                 ' <span class="pill mute">' + m.course.credits + ' cr &middot; ' + m.course.type + '</span></li>';
        }).join('') + '</ul></p>'
      : '<p class="note ok"><span class="note-lbl">Scheme coverage</span>Every course in the approved Semester ' +
        state.sem + ' scheme appears somewhere on this timetable.</p>';

    /* source flags */
    var flags = (tt.flags && tt.flags.length)
      ? '<p class="note alert"><span class="note-lbl">Read this alongside the grid &mdash; notes on the source document</span><ul>' +
        tt.flags.map(function(f){ return '<li>' + f + '</li>'; }).join('') + '</ul></p>'
      : '';

    var loadSection = state.view === 'calendar' ? '' :
      '<div class="section-title" style="margin-top:44px"><span class="num">&sum;</span><div>' +
        '<h2>Weekly load, computed from the grid</h2>' +
        '<p class="sub">Lunch columns crossed by a spanning block are excluded from the totals.</p></div></div>' +
      '<div class="tt-scroll"><table class="data-table"><thead><tr>' +
        '<th>Code</th><th>Course / activity</th><th class="num">Credits</th>' +
        '<th class="num">Sessions</th><th>Hours per week</th></tr></thead>' +
        '<tbody>' + loadRows + '</tbody></table></div>' +
      covNote;

    var calendarHint = '<p class="note" style="margin:14px 0 0"><span class="note-lbl">Click any session</span>' +
      'to see what it is &mdash; the course&rsquo;s aim and outcomes and, where a day-wise plan exists, the ' +
      '<span style="color:var(--wine);font-weight:700">&#128214; module</span> taught on that date with its objectives, topics, ' +
      'teaching guide and where it sits in the whole course plan.</p>';
    var dayPlanPanel = '';

    document.getElementById('body').innerHTML =
      meta + term + flags +
      TT.renderLegend(tt) +
      monthNav +
      main +
      calendarHint +
      dayPlanPanel +
      loadSection;

    /* legend chips filter by kind (grid / agenda views only) */
    TT.$$('.legend-chip').forEach(function(chip){
      chip.setAttribute('aria-pressed', String(state.kind === chip.dataset.kind));
      chip.addEventListener('click', function(){
        state.kind = (state.kind === chip.dataset.kind) ? null : chip.dataset.kind;
        render();
      });
    });

    /* month tabs (calendar view only) */
    TT.$$('.month-tab[data-m]').forEach(function(tab){
      tab.addEventListener('click', function(){
        state.month = { y: +tab.getAttribute('data-y'), m: +tab.getAttribute('data-m') };
        render();
      });
    });

    /* week navigation (grid / day-by-day views) */
    TT.$$('.month-tab[data-week]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var v = btn.getAttribute('data-week');
        state.week = v === 'today' ? TT.mondayOfWeek(new Date()) : addDays(state.week, +v);
        render();
      });
    });

    /* every session in every view opens its detail card */
    TT.wireSessionClicks(document.getElementById('body'), tt);

    document.getElementById('range-bar').style.display = '';
    syncRangeUI();

  }

  function cell(lbl, val, sub){
    return '<div><span class="lbl">' + lbl + '</span><span class="val">' + val + '</span>' +
           '<span class="sub">' + (sub || '') + '</span></div>';
  }

  buildSegs();
  render();
  setInterval(render, 60000);
}).catch(function(e){ console.error(e); });
</script>
</body>
</html>
