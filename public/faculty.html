<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Faculty Load | RSPH Smart Timetable</title>
<link rel="icon" type="image/svg+xml" href="assets/rsph_icon.svg"/>
<link rel="stylesheet" href="assets/style.css"/>
</head>
<body>
<div id="site-header"></div>

<main class="container">

<div class="page-title-bar">
  <span class="eyebrow smallcaps">Who is on the grid</span>
  <h1>Teaching Load by Owner</h1>
  <p>Every session that names a teacher or an owning department, rolled up across both programmes. Sessions the issued timetable leaves unattributed are listed separately &mdash; they are the ones still waiting for an allocation.</p>
</div>

<div id="body"></div>

</main>
<div id="site-footer"></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
RSPH_READY.then(function(){
  TT.mountChrome('faculty.html');

  var load = TT.facultyLoad();
  var named = load.filter(function(f){ return f.named; });
  var depts = load.filter(function(f){ return !f.named; });
  var all = TT.allSessions().filter(function(s){ return s.kind !== 'lunch'; });
  var unattributed = all.filter(function(s){ return !s.faculty; });

  var max = load.reduce(function(a,f){ return Math.max(a, f.minutes); }, 0) || 1;

  function table(list, caption){
    if (!list.length) return '';
    return '<table class="data-table"><thead><tr>' +
      '<th>' + caption + '</th><th class="num">Sessions</th><th>Programmes</th>' +
      '<th>Hours per week</th><th>What they hold</th></tr></thead><tbody>' +
      list.map(function(f){
        var progs = {};
        f.sessions.forEach(function(s){ progs[s.tt.prog] = true; });
        var what = {};
        f.sessions.forEach(function(s){ what[TT.plain(s.title)] = (what[TT.plain(s.title)] || 0) + 1; });
        return '<tr>' +
          '<td><strong style="color:var(--indigo)">' + f.name + '</strong></td>' +
          '<td class="num">' + f.sessions.length + '</td>' +
          '<td>' + Object.keys(progs).map(function(p){
              return '<span class="pill ' + p + '">' + RSPH.programmes[p].short + '</span>';
            }).join(' ') + '</td>' +
          '<td><div class="bar-cell" style="--k:var(--indigo)">' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + (f.minutes/max*100) + '%"></div></div>' +
            '<span class="bar-val">' + TT.hrs(f.minutes) + '</span></div></td>' +
          '<td style="font-size:12.5px;color:var(--ink-soft)">' +
            Object.keys(what).map(function(t){
              return t + (what[t] > 1 ? ' &times;' + what[t] : '');
            }).join('<br/>') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table>';
  }

  /* unattributed sessions, grouped by timetable */
  var byTT = {};
  unattributed.forEach(function(s){
    (byTT[s.tt.id] = byTT[s.tt.id] || []).push(s);
  });
  var unattrHTML = Object.keys(byTT).map(function(id){
    var list = byTT[id], tt = list[0].tt, p = RSPH.programmes[tt.prog];
    var mins = list.reduce(function(a,s){ return a + s.netMinutes; }, 0);
    var titles = {};
    list.forEach(function(s){ titles[TT.plain(s.title)] = (titles[TT.plain(s.title)] || 0) + 1; });
    return '<tr><td><span class="pill ' + tt.prog + '">' + p.short + '</span> Semester ' + tt.sem + '</td>' +
      '<td class="num">' + list.length + '</td>' +
      '<td class="num">' + TT.hrs(mins) + '</td>' +
      '<td style="font-size:12.5px;color:var(--ink-soft)">' +
        Object.keys(titles).sort().map(function(t){
          return t + (titles[t] > 1 ? ' &times;' + titles[t] : '');
        }).join(' &middot; ') + '</td></tr>';
  }).join('');

  var attributedMin = load.reduce(function(a,f){ return a + f.minutes; }, 0);
  var totalMin = all.reduce(function(a,s){ return a + s.netMinutes; }, 0);
  var pct = totalMin ? Math.round(attributedMin / totalMin * 100) : 0;

  document.getElementById('body').innerHTML =
    '<div class="tt-meta">' +
      m('Named teachers', named.length, 'Individuals on the issued grids') +
      m('Departmental owners', depts.length, 'Sessions owned by a school/faculty') +
      m('Attributed load', pct + '%', TT.hrs(attributedMin) + ' of ' + TT.hrs(totalMin) + ' per week') +
      m('Unattributed sessions', unattributed.length, 'No teacher named in the source') +
    '</div>' +

    (named.length
      ? '<div class="section-title" style="margin-top:30px"><span class="num">1</span><div>' +
        '<h2>Named faculty</h2><p class="sub">Individuals printed on the issued timetables.</p></div></div>' +
        table(named, 'Faculty member')
      : '') +

    (depts.length
      ? '<div class="section-title" style="margin-top:30px"><span class="num">2</span><div>' +
        '<h2>Sessions owned by a department</h2>' +
        '<p class="sub">The timetable names the owning school rather than an individual.</p></div></div>' +
        table(depts, 'Owning department')
      : '') +

    '<div class="section-title" style="margin-top:30px"><span class="num">3</span><div>' +
      '<h2>Sessions with no owner named</h2>' +
      '<p class="sub">These carry real contact hours but no teacher on the issued document &mdash; ' +
      'the allocation list for the course coordinator.</p></div></div>' +
    (unattrHTML
      ? '<table class="data-table"><thead><tr><th>Timetable</th><th class="num">Sessions</th>' +
        '<th class="num">Hours / week</th><th>Sessions</th></tr></thead><tbody>' + unattrHTML + '</tbody></table>'
      : '<p class="note ok"><span class="note-lbl">Fully allocated</span>Every session on every published ' +
        'timetable names a teacher or an owning department.</p>') +

    '<p class="note"><span class="note-lbl">How this is counted</span>Hours are the clock hours of each block, ' +
    'excluding any lunch column a long block crosses. A block is credited to whoever the issued timetable ' +
    'names in brackets beneath the session title; nothing here is inferred.</p>';

  function m(lbl, val, sub){
    return '<div><span class="lbl">' + lbl + '</span><span class="val">' + val + '</span>' +
           '<span class="sub">' + sub + '</span></div>';
  }
}).catch(function(e){ console.error(e); });
</script>
</body>
</html>
